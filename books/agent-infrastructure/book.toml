# 书的元数据。语言版本目录与 editions 一一对应（第一个为权威版本，其余逐条对齐）。
[book]
version = "0.1.0"
authors = ["ChronoAI"]
license = "CC-BY-4.0"
editions = ["zh", "en"]
# 每个语言版本内的 Markdown 单页最多行数；含空行、注释和代码行。
max_page_lines = 1000
# 封面与站点卡片上的赛博朋克代号，形如 CODE//NAME。
code = "CHRONO//STACK"
# 出版日期（YYYY-MM-DD），进入 PDF/EPUB 元数据；留空则用构建当天（产物不能跨日复现）。
date = "2026-12-17"
# Stable publication DOI (usually the Zenodo concept DOI); omit until one is assigned.
doi = ""

[book.title]
zh = "整车工程"
en = "The Complete Vehicle"

[book.subtitle]
zh = "ChronoAI 全栈产品与安全架构手册"
en = "ChronoAI Full-Stack Product & Security Architecture"

[book.description]
zh = "逐层拆解智能体如何经由 NyxID 获得授权、由 Ornn 管理技能、在 CMA 与 heca 中运行，再接受 chrono-harness 的变更判定。结合线上应用与实体家庭场景，说明各层的信任边界、安全约束与交付成熟度。"
en = "Trace how agents receive scoped access through NyxID, manage skills with Ornn, run in CMA and heca, and submit changes to chrono-harness for evaluation. Examples from online applications and connected homes show where each layer places its trust boundaries and how far it has progressed toward deployment."

[outputs]
html = true
# PDF 版本：screen = 深色霓虹屏幕版；print = 白底印刷版；academic = A4 单栏学术预印本（可选）。
pdf = ["screen", "print"]
# EPUB 3（Apple Books 兼容，MathML 数学）。
epub = true

[pdf]
# Typst 纸张名：a4、a5、us-letter、iso-b5 …
paper = "a4"

[epub]
# 是否把 Chakra Petch / JetBrains Mono 嵌入 EPUB（中文正文始终使用阅读器自带字体）。
embed_fonts = false

[numbering.unnumbered]
"appendix-a-enterprise-repo-atlas.md" = "A"
"appendix-b-security-and-readiness.md" = "B"
