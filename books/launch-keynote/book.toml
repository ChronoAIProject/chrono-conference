# 书的元数据。语言版本目录与 editions 一一对应（第一个为权威版本，其余逐条对齐）。
[book]
version = "0.1.0"
authors = ["ChronoAI"]
license = "CC-BY-4.0"
editions = ["zh", "en"]
# 每个语言版本内的 Markdown 单页最多行数；含空行、注释和代码行。
max_page_lines = 1000
# 封面与站点卡片上的赛博朋克代号，形如 CODE//NAME。
code = "CHRONO//KEYNOTE"
# 出版日期（YYYY-MM-DD），进入 PDF/EPUB 元数据；留空则用构建当天（产物不能跨日复现）。
date = "2026-12-17"
# Stable publication DOI (usually the Zenodo concept DOI); omit until one is assigned.
doi = ""

[book.title]
zh = "面向未来的造物"
en = "Build for What Comes Next"

[book.subtitle]
zh = "2026 ChronoAI 线上发布会主书与全程讲稿"
en = "The 2026 ChronoAI Virtual Launch Manifesto & Keynote"

[book.description]
zh = "从执行成本下降与判断力的稀缺谈起，沿着整车架构演示、开放科研核验和 Street Corner 虚拟会场，走完 75 分钟的线上发布会。收录全程讲稿、导播提示与证据总账。"
en = "Follow the 75-minute virtual launch from the falling cost of execution and the scarcity of judgment through the complete-vehicle demo, an open research audit, and a tour of Street Corner. Includes the full script, broadcast cues, and claims ledger."

[outputs]
html = true
# PDF 版本：screen = 深色霓虹屏幕版；print = 白底印刷版；academic = A4 单栏学术预印本（可选）。
pdf = ["screen", "print", "academic"]
# EPUB 3（Apple Books 兼容，MathML 数学）。
epub = true

[pdf]
# Typst 纸张名：a4、a5、us-letter、iso-b5 …
paper = "a4"

[epub]
# 是否把 Chakra Petch / JetBrains Mono 嵌入 EPUB（中文正文始终使用阅读器自带字体）。
embed_fonts = false

[numbering.unnumbered]
"coda.md" = "Coda"
"appendix-a-rundown-and-cues.md" = "A"
"appendix-b-evidence-and-claims.md" = "B"
